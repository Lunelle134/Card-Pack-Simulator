<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pack Pop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      font-family: Arial, sans-serif;
      background: #160d21;
    }

    button {
      font: inherit;
    }

    .shop,
    .screen {
      min-height: 100vh;
    }

    .shop {
      position: relative;
      display: grid;
      padding: 90px 20px;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 34%, #ffd48655, transparent 30%),
        linear-gradient(#70452e 0 43%, #3a232d 43% 100%);
    }

    .shop::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background:
        repeating-linear-gradient(90deg, #47271988 0 7px, transparent 7px 80px),
        repeating-linear-gradient(0deg, #3c202766 0 5px, transparent 5px 68px);
    }

    .title {
      position: absolute;
      z-index: 2;
      top: 100px;
      text-align: center;
      text-shadow: 0 4px 10px #301425;
    }

    .title p {
      margin: 0;
      color: #ffdc74;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .title h1 {
      margin: 7px 0;
      font-size: clamp(34px, 6vw, 66px);
    }

    .title span {
      font-weight: bold;
    }

    .counter {
      position: absolute;
      bottom: 13%;
      left: 50%;
      width: min(850px, 90vw);
      height: 120px;
      transform: translateX(-50%);
      border-radius: 40px 40px 0 0;
      background: linear-gradient(160deg, #e3a05c, #7a412d);
      box-shadow: 0 -12px 0 #ffd48a55;
    }

    .packs {
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(12px, 3vw, 40px);
      margin-top: 130px;
    }

    .pack {
      position: relative;
      width: clamp(120px, 18vw, 205px);
      aspect-ratio: 0.66;
      overflow: hidden;
      border: 6px solid #ffe39e;
      border-radius: 12px 12px 20px 20px;
      color: white;
      cursor: pointer;
      box-shadow: 0 15px 22px #1d101999;
      transition: transform 0.2s, filter 0.2s;
    }

    .pack:hover {
      z-index: 3;
      filter: brightness(1.16);
      transform: translateY(-22px) scale(1.08);
    }

    .aqua {
      background: linear-gradient(145deg, #00c2c9, #3262ca 52%, #5a2b94);
    }

    .sunset {
      background: linear-gradient(145deg, #f9a52c, #df4e68 52%, #73338e);
    }

    .moss {
      background: linear-gradient(145deg, #91cd55, #219877 52%, #28649d);
    }

    .pack::before,
    .pack::after {
      content: "";
      position: absolute;
      left: -10%;
      width: 120%;
      height: 17px;
      border-top: 2px solid #ffffff99;
      border-bottom: 2px solid #ffffff77;
      background: #44206677;
    }

    .pack::before {
      top: 10px;
    }

    .pack::after {
      bottom: 10px;
    }

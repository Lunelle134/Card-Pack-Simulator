<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pack Pop</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;color:white;font-family:Arial,sans-serif;background:#190d27}
button{font:inherit;cursor:pointer}
.shop{min-height:100vh;display:grid;place-items:center;position:relative;padding:120px 20px 70px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#ffd486aa,transparent 32%),linear-gradient(#75472f 0 45%,#3b252d 45%)}
.title{position:absolute;top:100px;text-align:center;text-shadow:0 3px 8px #321426}
.title h1{margin:4px 0;font-size:clamp(34px,6vw,65px)}
.title p{margin:0;color:#ffdc70;font-size:12px;font-weight:bold;letter-spacing:3px}
.title span{font-weight:bold}
.counter{position:absolute;bottom:14%;width:min(850px,90vw);height:120px;border-radius:35px 35px 0 0;background:linear-gradient(160deg,#dfa05b,#7f452e)}
.packs{display:flex;z-index:2;align-items:end;justify-content:center;gap:clamp(8px,3vw,40px);margin-top:120px}
.pack{position:relative;width:clamp(120px,18vw,205px);aspect-ratio:.66;border:6px solid #ffe39f;border-radius:12px 12px 20px 20px;color:#fff;box-shadow:0 15px 20px #170b1c99;transition:.2s}
.pack:hover{transform:translateY(-22px) scale(1.08);filter:brightness(1.15)}
.aqua{background:linear-gradient(145deg,#00c4cb,#3061c8 50%,#5c2995)}
.sunset{background:linear-gradient(145deg,#f9a52d,#df4e68 50%,#73338e)}
.moss{background:linear-gradient(145deg,#91cd55,#219877 50%,#28649d)}
.orb{position:absolute;top:18%;left:25%;display:grid;width:50%;aspect-ratio:1;place-items:center;border:4px solid #ffeb90;border-radius:50%;font-size:40px}
.pack-name{position:absolute;bottom:23%;left:0;width:100%;font-size:clamp(18px,3vw,32px);font-weight:900;line-height:.85}
.pack-small{position:absolute;bottom:13%;left:0;width:100%;font-size:11px;font-weight:bold}
.hint{position:absolute;bottom:4%;font-weight:bold}
.screen{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center}
.screen.show{display:flex}
.choose{flex-direction:column;background:#170b23ed}
.choose .pack{width:min(230px,52vw)}
.choose p{font-size:22px;font-weight:bold}
.text{border:0;color:#fff;background:transparent;text-decoration:underline;font-weight:bold}
.reveal{z-index:20;flex-direction:column;background:radial-gradient(circle,#51479d,#21133f 50%,#100a18)}
.stage{width:min(325px,70vw);aspect-ratio:.7;perspective:1000px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:.7s}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border:8px solid #ffe7a2;border-radius:20px;backface-visibility:hidden}
.back{display:grid;place-items:center;background:radial-gradient(circle,#8065ca,#292466)}
.back span{font-size:80px;color:#ffe77d}
.front{padding:12px;transform:rotateY(180deg);color:#291b31;background:#fff0bf}
.top,.bottom{display:flex;justify-content:space-between;font-size:11px;font-weight:bold}
.art{display:grid;height:58%;margin-top:8px;place-items:center;border:4px solid #513366;border-radius:10px;font-size:100px}
.front h2{margin:7px 0 3px;font-size:28px}
.front p{font-size:12px}
.rarity{padding:3px 6px;border-radius:5px;color:#fff;background:#66878a;font-size:9px}
.progress{display:flex;gap:9px;margin-top:20px}
.dot{width:10px;height:10px;border:2px solid #fff;border-radius:50%}
.dot.on{background:#ffe178;border-color:#ffe178}
.results{z-index:30;padding:25px;background:#170b23ee}
.panel{width:min(850px,100%);padding:35px;border-radius:25px;color:#34213e;text-align:center;background:#fff0bf}
.panel h2{font-size:48px;margin:5px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.mini{min-height:140px;padding:10px;border:3px solid #fff;color:#fff;text-align:left}
.mini b{display:block;margin-top:15px}
.primary{margin-top:25px;padding:13px 22px;border:0;border-radius:10px;color:white;background:#a64e9c;font-weight:bold}
@media(max-width:600px){.packs{gap:3px}.pack{border-width:4px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<section class="shop">
<div class="counter"></div>
<div class="title"><p>WELCOME TO</p><h1>The Pack Counter</h1><span>Pick a pack and see what you pull</span></div>
<div class="packs">
<button class="pack aqua" data-pack="Aqua Burst"><span class="orb">✦</span><span class="pack-name">AQUA<br>BURST</span><span class="pack-small">5 CARDS</span></button>
<button class="pack sunset" data-pack="Sunset Spark"><span class="orb">☀</span><span class="pack-name">SUNSET<br>SPARK</span><span class="pack-small">5 CARDS</span></button>
<button class="pack moss" data-pack="Moss Myth"><span class="orb">✿</span><span class="pack-name">MOSS<br>MYTH</span><span class="pack-small">5 CARDS</span></button>
</div>
<p class="hint">Click a pack to pick it up</p>
</section>

<section class="screen choose" id="choose">
<div id="chosen"></div>
<p>Click the pack to open it</p>
<button class="text" id="back">Put it back</button>
</section>

<section class="screen reveal" id="reveal">
<h3>PACK OPENING</h3>
<div class="stage" id="stage">
<div class="card" id="card">
<div class="face back"><span>✦</span></div>
<div class="face front">
<div class="top"><span id="set">AQUA BURST</span><span id="hp">50 HP</span></div>
<div class="art" id="art">🐟</div>
<h2 id="name">Bubblefin</h2>
<p id="desc">A mysterious card.</p>
<div class="bottom"><span class="rarity" id="rare">COMMON</span><span id="num">001/060</span></div>
</div>
</div>
</div>
<div class="progress" id="progress"></div>
<p id="hint2">Click card to flip</p>
<button class="text" id="skip">Skip reveal</button>
</section>

<section class="screen results" id="results">
<div class="panel"><h2>Your pulls</h2><div class="grid" id="grid"></div><button class="primary" id="again">Open another pack</button></div>
</section>

<script>
const data=[
["Bubblefin","Common","🐟","It flicks its tail to make tiny tidal waves.","linear-gradient(145deg,#45d7e8,#2779c7)"],
["Cinder Cub","Common","🦊","Warm sparks dance at the tip of its tail.","linear-gradient(145deg,#fa9c3d,#e75b52)"],
["Mist Manta","Uncommon","🪽","It glides through moonlit water.","linear-gradient(145deg,#7788e5,#43d5d3)"],
["Tidewyrm","Rare","🐉","When it roars, rivers change course.","linear-gradient(145deg,#4257b9,#9a57d8)"],
["Dawn Phoenix","Legendary","🔥","It rises when the horizon catches fire.","linear-gradient(145deg,#ffd34d,#f05358,#9d42b7)"]
];

let pulls=[],pos=0,flipped=false;

const choose=document.getElementById("choose");
const chosen=document.getElementById("chosen");
const reveal=document.getElementById("reveal");
const results=document.getElementById("results");
const card=document.getElementById("card");

function show(x){x.classList.add("show")}
function hide(x){x.classList.remove("show")}

document.querySelectorAll(".pack").forEach(pack=>{
pack.onclick=()=>{
chosen.innerHTML="";
let copy=pack.cloneNode(true);
copy.style.transform="none";
chosen.appendChild(copy);
show(choose);
copy.onclick=()=>{
pulls=[...data].sort(()=>Math.random()-.5);
pos=0;
hide(choose);
show(reveal);
putCard();
};
};
});

document.getElementById("back").onclick=()=>hide(choose);

function putCard(){
let c=pulls[pos];
card.classList.remove("flip");
flipped=false;
document.getElementById("set").textContent="PACK CARD";
document.getElementById("art").textContent=c[2];
document.getElementById("art").style.background=c[4];
document.getElementById("name").textContent=c[0];
document.getElementById("desc").textContent=c[3];
document.getElementById("rare").textContent=c[1].toUpperCase();
document.getElementById("num").textContent=(pos+1)+"/5";
document.getElementById("hint2").textContent="Click card to flip";
document.getElementById("progress").innerHTML=pulls.map((_,i)=>"<span class='dot "+(i===pos?"on":"")+"'></span>").join("");
}

document.getElementById("stage").onclick=()=>{
if(!flipped){
card.classList.add("flip");
flipped=true;
document.getElementById("hint2").textContent="Click for next card";
}else if(pos<pulls.length-1){
pos++;
putCard();
}else{
showResults();
}
};

window.onwheel=e=>{
if(reveal.classList.contains("show")&&flipped&&e.deltaY>10){
if(pos<pulls.length-1){pos++;putCard()}else showResults();
}
};

function showResults(){
hide(reveal);
document.getElementById("grid").innerHTML=pulls.map(c=>"<div class='mini' style='background:"+c[4]+"'><span>"+c[2]+"</span><b>"+c[0]+"</b><small>"+c[1]+"</small></div>").join("");
show(results);
}

document.getElementById("skip").onclick=showResults;
document.getElementById("again").onclick=()=>hide(results);
</script>
</body>
</html>
